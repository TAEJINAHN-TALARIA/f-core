name: Daily SEC EDGAR ETL

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/etl.yml"
  schedule:
    # 14:00 UTC = 9am ET, after SEC's morning bulk data refresh
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m etl.pipeline

      - name: Upload parser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-audit-${{ github.run_id }}
          path: |
            docs/parser_audit.md
            docs/parser_audit.json
          retention-days: 90
