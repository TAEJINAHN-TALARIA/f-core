version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    profiles:
      - etl
    command: python -m etl.pipeline
